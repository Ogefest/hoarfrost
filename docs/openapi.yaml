openapi: 3.1.0
info:
  title: hoarfrost read API
  version: "1.0"
  summary: Read access to pages archived by hoarfrost.
  description: |
    hoarfrost collects and stores web pages; other applications present and
    analyse them through this API. It only reads: search, filter, follow new
    captures and download their content.

    Authenticate with a read-only API key (`hfr_…`, created by an admin under
    System → API keys) or a user token (`hf_…`) in the `Authorization:
    Bearer` header.

    Identify pages by `captureId`. It never changes, while the numeric `id`
    is reassigned when a week of the archive is reindexed.

    Endpoints that change the archive (queueing URLs, uploads, sources) need
    a user token with the editor role and are described in `docs/api.md`.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: https://archive.example.org
    description: Your hoarfrost instance
security:
  - bearer: []
tags:
  - name: pages
    description: Archived pages and files
  - name: packages
    description: Weekly WACZ packages and raw WARC records

paths:
  /api/pages:
    get:
      tags: [pages]
      operationId: listPages
      summary: List pages after a cursor
      description: |
        Pages in the order they were archived. Keep `next` and pass it as
        `after` to get newer pages; an empty `results` means you are up to
        date and `next` stays the same.

        Delivery is at least once: reindexing a week inserts its pages again
        under new ids, so deduplicate by `captureId`.
      parameters:
        - name: after
          in: query
          description: Return pages with an `id` greater than this cursor (`next` of the previous response).
          schema: {type: integer, format: int64, minimum: 0, default: 0}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 100}
        - $ref: "#/components/parameters/source"
        - $ref: "#/components/parameters/storage"
        - $ref: "#/components/parameters/domain"
        - $ref: "#/components/parameters/kind"
        - $ref: "#/components/parameters/keyword"
        - $ref: "#/components/parameters/from"
        - $ref: "#/components/parameters/to"
      responses:
        "200":
          description: A batch of pages.
          content:
            application/json:
              schema:
                type: object
                required: [results, next]
                properties:
                  results:
                    type: array
                    items: {$ref: "#/components/schemas/Page"}
                  next:
                    type: integer
                    format: int64
                    description: Cursor for the following request.
        "400":
          description: Invalid cursor.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/search:
    get:
      tags: [pages]
      operationId: searchPages
      summary: Full-text search
      description: |
        Searches titles, descriptions and text, ignoring case and
        diacritics; every word must match and the last one is a prefix.
        Results are ordered by relevance when `q` is given, otherwise newest
        first.
      parameters:
        - name: q
          in: query
          description: Search words; empty lists all pages.
          schema: {type: string}
        - $ref: "#/components/parameters/source"
        - $ref: "#/components/parameters/storage"
        - $ref: "#/components/parameters/domain"
        - $ref: "#/components/parameters/kind"
        - $ref: "#/components/parameters/keyword"
        - $ref: "#/components/parameters/from"
        - $ref: "#/components/parameters/to"
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 500, default: 50}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        "200":
          description: Matching pages.
          content:
            application/json:
              schema:
                type: object
                required: [total, results]
                properties:
                  total:
                    type: integer
                    description: Number of all matches.
                  results:
                    type: array
                    items: {$ref: "#/components/schemas/Page"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/facets:
    get:
      tags: [pages]
      operationId: getFacets
      summary: Values for the filters
      responses:
        "200":
          description: Sources, storages and kinds present in the archive.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Facets"}
        "401": {$ref: "#/components/responses/Unauthorized"}

  /api/pages/{id}:
    get:
      tags: [pages]
      operationId: getPage
      summary: Page metadata with extracted text
      parameters:
        - $ref: "#/components/parameters/pageRef"
      responses:
        "200":
          description: The page, including `text`.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Page"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404":
          description: Unknown page.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /api/pages/{id}/content:
    get:
      tags: [pages]
      operationId: getPageContent
      summary: The captured file
      description: |
        The response body as archived (HTML, PDF, image…) with its original
        content type, served as an attachment in a sandbox. Resources of an
        HTML page are not included; use the HTML export for a self-contained
        copy.
      parameters:
        - $ref: "#/components/parameters/pageRef"
      responses:
        "200":
          description: The captured file.
          headers:
            X-Hoarfrost-URL:
              description: Archived URL.
              schema: {type: string, format: uri}
            X-Hoarfrost-Captured:
              description: Capture time.
              schema: {type: string, format: date-time}
            X-Hoarfrost-Status:
              description: Original HTTP status.
              schema: {type: integer}
            Content-Disposition:
              schema: {type: string}
          content:
            "*/*":
              schema: {type: string, format: binary}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404":
          description: Unknown page, or no stored response.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "502":
          description: The storage could not be read.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}

  /api/export/{file}:
    get:
      tags: [pages]
      operationId: exportPageHTML
      summary: Single-file HTML export
      description: The page as one HTML file with its archived resources inlined as `data:` URIs.
      parameters:
        - name: file
          in: path
          required: true
          description: "`{captureId}.html` or `{id}.html`."
          schema: {type: string, examples: ["f0d49dfc-0812-476d-9136-8c277663e5ac.html"]}
      responses:
        "200":
          description: HTML document.
          content:
            text/html:
              schema: {type: string}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFoundText"}

  /api/record/{recordId}:
    get:
      tags: [packages]
      operationId: getRecord
      summary: Raw WARC record
      parameters:
        - name: recordId
          in: path
          required: true
          description: WARC-Record-ID with or without `<urn:uuid:…>`, e.g. the end of `links.record`.
          schema: {type: string}
      responses:
        "200":
          description: One gzip member of a WARC file.
          content:
            application/warc:
              schema: {type: string, format: binary}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFoundText"}

  /wacz/{storage}/{year}/{week}:
    get:
      tags: [packages]
      operationId: getWeeklyPackage
      summary: Weekly WACZ package
      description: A sealed week of a storage. Supports HTTP Range requests.
      parameters:
        - name: storage
          in: path
          required: true
          schema: {type: string, examples: [default]}
        - name: year
          in: path
          required: true
          schema: {type: string, pattern: "^[0-9]{4}$", examples: ["2026"]}
        - name: week
          in: path
          required: true
          schema: {type: string, pattern: "^W[0-9]{2}\\.wacz$", examples: [W43.wacz]}
        - name: Range
          in: header
          schema: {type: string, examples: ["bytes=0-1023"]}
      responses:
        "200":
          description: The package.
          content:
            application/wacz+zip:
              schema: {type: string, format: binary}
        "206":
          description: Part of the package.
          content:
            application/wacz+zip:
              schema: {type: string, format: binary}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404": {$ref: "#/components/responses/NotFoundText"}

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Read-only API key `hfr_…` or user token `hf_…`.

  parameters:
    pageRef:
      name: id
      in: path
      required: true
      description: "`captureId` (recommended) or numeric `id`."
      schema: {type: string, examples: ["f0d49dfc-0812-476d-9136-8c277663e5ac"]}
    source:
      name: source
      in: query
      description: Exact source name (see `/api/facets`).
      schema: {type: string}
    storage:
      name: storage
      in: query
      description: Exact storage name.
      schema: {type: string}
    domain:
      name: domain
      in: query
      description: Host, matching its subdomains too.
      schema: {type: string, examples: [news.example.com]}
    kind:
      name: kind
      in: query
      schema: {$ref: "#/components/schemas/Kind"}
    keyword:
      name: keyword
      in: query
      description: Pages tagged with this keyword (see `keywords`), ignoring case and diacritics.
      schema: {type: string, examples: [city council]}
    from:
      name: from
      in: query
      description: Captured at or after. A date covers the whole day in the server's time zone; an RFC 3339 time is exact (URL-encode `+`).
      schema: {type: string, examples: ["2026-10-01", "2026-10-01T06:00:00Z"]}
    to:
      name: to
      in: query
      description: Captured before the end of this date, or before this RFC 3339 time.
      schema: {type: string, examples: ["2026-10-31", "2026-10-31T18:00:00Z"]}

  responses:
    Unauthorized:
      description: Missing, invalid, revoked or expired credentials.
      content:
        text/plain:
          schema: {type: string}
    NotFoundText:
      description: Not found.
      content:
        text/plain:
          schema: {type: string}

  schemas:
    Kind:
      type: string
      enum: [page, attachment, ocr]
      description: "`page`: an HTML page; `attachment`: a linked file such as a PDF; `ocr`: text recognised in an attachment."

    Page:
      type: object
      required: [id, captureId, url, title, captured, source, engine, kind, textLength, storage, epoch, links]
      properties:
        id:
          type: integer
          format: int64
          description: Index id; changes when the week is reindexed. Use it only as a cursor.
        captureId:
          type: string
          format: uuid
          description: Stable identifier of the capture.
        url:
          type: string
          format: uri
        title:
          type: string
        description:
          type: string
        captured:
          type: string
          format: date-time
        published:
          type: string
          format: date
          description: Publication date when the page states it (schema.org `datePublished`, `article:published_time`, `dt-published`, or the text).
        authors:
          type: array
          items: {type: string}
          description: People named as author, creator, contributor or editor in schema.org data, `h-entry` authors and `article:author` names.
        schemaTypes:
          type: array
          items: {type: string}
          examples: [[NewsArticle]]
        schemaOrg:
          type: array
          items: {type: object}
          description: schema.org objects found in the page (JSON-LD, microdata, RDFa Lite).
        openGraph:
          type: object
          description: |
            Open Graph (`og:`, `article:`, `book:`, `profile:`, `music:`, `video:`) and Twitter Card
            (`twitter:`) properties. A property is a string, or an array of strings when the page repeats it.
          additionalProperties:
            oneOf:
              - type: string
              - type: array
                items: {type: string}
          examples:
            - {"og:type": "article", "og:image": ["https://news.example.com/a.jpg", "https://news.example.com/b.jpg"], "article:tag": "Budget", "twitter:card": "summary"}
        microformats:
          type: array
          description: |
            Top-level microformats2 items (`h-entry`, `h-card`, `h-event`…) in the JSON format of the
            mf2 parsing specification, with relative URLs resolved. Embedded HTML of `e-*` properties is
            omitted; long values are shortened to 2,000 characters.
          items:
            type: object
            required: [type, properties]
            properties:
              type: {type: array, items: {type: string}}
              properties: {type: object, additionalProperties: {type: array, items: {}}}
              children: {type: array, items: {type: object}}
              value: {type: string}
              id: {type: string}
        keywords:
          type: array
          items: {type: string}
          description: |
            Tags of the page, without duplicates: schema.org `keywords` and `articleSection`, Open Graph
            `article:tag`, microformats `p-category` of `h-entry` items and `<meta name="keywords">`.
        source:
          type: string
          description: Source that captured the page, `api` or `upload` for manual additions.
        engine:
          type: string
          examples: [static, chrome, http]
        kind:
          $ref: "#/components/schemas/Kind"
        mime:
          type: string
        status:
          type: integer
          description: HTTP status of the capture.
        textLength:
          type: integer
          description: Length of the extracted text in characters.
        storage:
          type: string
        epoch:
          type: string
          pattern: "^[0-9]{4}-W[0-9]{2}$"
          description: ISO week the capture belongs to.
        recordId:
          type: string
          description: WARC-Record-ID of the main response.
        links:
          $ref: "#/components/schemas/PageLinks"
        text:
          type: string
          description: Extracted text; only in `GET /api/pages/{id}`.

    PageLinks:
      type: object
      required: [self]
      description: Paths relative to the server.
      properties:
        self: {type: string}
        content: {type: string, description: The captured file.}
        html: {type: string, description: Single-file HTML export (pages only).}
        record: {type: string, description: Raw WARC record.}

    Facets:
      type: object
      required: [sources, storages, kinds]
      properties:
        sources:
          type: array
          items:
            type: object
            required: [name, pages, lastCaptured]
            properties:
              name: {type: string}
              pages: {type: integer, format: int64}
              lastCaptured: {type: string, format: date-time}
        storages:
          type: array
          items: {type: string}
        kinds:
          type: array
          items: {$ref: "#/components/schemas/Kind"}

    Error:
      type: object
      required: [error]
      properties:
        error: {type: string}
