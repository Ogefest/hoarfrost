# Publishes a release when a version tag is pushed (see docs/releasing.md):
#
#   git tag -a v0.2.0 -m v0.2.0 && git push origin v0.2.0
#
# The whole CI suite runs first. Then binaries are built, the image is
# installed and smoke-tested, pushed to ghcr.io for amd64 and arm64, and a
# GitHub release is created with notes grouped by pull request labels
# (.github/release.yml). A tag with a suffix (v0.2.0-rc.1) is published as a
# pre-release and does not move the "latest" image.
name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        run: |
          tag=${GITHUB_REF_NAME}
          if ! [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::$tag is not a version tag (vMAJOR.MINOR.PATCH[-suffix])"; exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          [[ $tag == *-* ]] && echo "prerelease=true" >> "$GITHUB_OUTPUT" || echo "prerelease=false" >> "$GITHUB_OUTPUT"

  binaries:
    needs: [ci, meta]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Build
        env: { VERSION: "${{ needs.meta.outputs.version }}" }
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}; arch=${target#*/}
            name=hoarfrost_${VERSION}_${os}_${arch}
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/ogefest/hoarfrost/internal/version.Version=$VERSION" \
              -o "build/$name/hoarfrost" ./cmd/hoarfrost
            cp LICENSE README.md .env.example "build/$name/"
            tar -C build -czf "dist/$name.tar.gz" "$name"
          done
          cp deploy/compose.yaml dist/compose.yaml
          cp deploy/install.env dist/install.env
          # Pin the image of this release in the bundled settings.
          sed -i "s/^HOARFROST_VERSION=latest$/HOARFROST_VERSION=$VERSION/" dist/install.env
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  image:
    needs: [ci, meta]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/hoarfrost
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: hoarfrost:release
          build-args: VERSION=${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install from deploy/compose.yaml and capture a page
        run: scripts/smoke-install.sh hoarfrost:release "$VERSION"
      - name: Tags
        id: tags
        run: |
          image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          tags="$image:$VERSION"
          if [ "${{ needs.meta.outputs.prerelease }}" = false ]; then
            minor=${VERSION%.*}
            tags="$tags,$image:$minor,$image:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push amd64 and arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: VERSION=${{ env.VERSION }}
          cache-from: type=gha
          labels: org.opencontainers.image.revision=${{ github.sha }}

  release:
    needs: [meta, binaries, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist }
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          pre=""
          [ "${{ needs.meta.outputs.prerelease }}" = true ] && pre="--prerelease"
          {
            echo "## Install"
            echo
            echo '```sh'
            echo "curl -LO https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/compose.yaml"
            echo "curl -L -o .env https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/install.env"
            echo "# fill in the secrets in .env (it says how), then:"
            echo "docker compose up -d"
            echo '```'
            echo
            echo "Image: \`ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/hoarfrost:${VERSION}\` (linux/amd64, linux/arm64)."
            echo "Binaries for Linux and macOS are attached; they need PostgreSQL and, optionally, Chromium and pdftotext."
            echo "See [docs/install.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/install.md); before upgrading read the *Upgrade notes* below, if any."
            echo
          } > notes.md
          # Upgrade notes written in the annotated tag message, if any.
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          # The body of the tag message, without its subject line.
          msg=$(git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" | sed '/^-----BEGIN/,$d')
          if [ -n "${msg//[[:space:]]/}" ]; then
            { echo "## Upgrade notes"; echo; echo "$msg"; echo; } >> notes.md
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "hoarfrost $VERSION" \
            --notes-file notes.md --generate-notes --verify-tag $pre
