{{define "content"}}
<section class="narrow card">
  <h1><img class="logo" src="/static/logo.svg?v={{version}}" alt="" width="20" height="20"> Sign in</h1>
  {{with .Data.Error}}<div class="flash err">{{.}}</div>{{end}}
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{.Data.Next}}">
    <label>Login <input name="login" autocomplete="username" required autofocus></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button class="primary wide">Sign in</button>
  </form>
  <p class="muted">Lost access? Run <code>hoarfrost user reset-password &lt;login&gt;</code> on the server.</p>
</section>
{{end}}
