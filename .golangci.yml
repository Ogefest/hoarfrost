version: "2"
run:
  timeout: 10m
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - noctx
    - revive
    - sqlclosecheck
    - unconvert
    - usestdlibvars
  settings:
    errcheck:
      exclude-functions:
        - (net/http.ResponseWriter).Write
        - (*database/sql.Tx).Rollback
        - (*bufio.Writer).WriteString
        - (*bufio.Writer).WriteByte
        - (*encoding/json.Encoder).Encode
        - (hash.Hash).Write
        - golang.org/x/net/html.Render
    revive:
      rules:
        - name: exported
          disabled: true
    gocritic:
      disabled-checks: [ifElseChain, singleCaseSwitch]
  exclusions:
    presets: [comments, std-error-handling]
    rules:
      - path: _test\.go
        linters: [errcheck, noctx, bodyclose, errorlint, usestdlibvars]
formatters:
  enable: [gofmt, goimports]
